<!-- 🔨 AUCTIONEER CONTROL PANEL (Visible to Auctioneer / Admin) -->
<div id="auctioneer-panel" style="background: #111827; border: 1px solid #1f2937; border-radius: 8px; padding: 16px; margin-bottom: 20px;">
  <h3 style="color: #10b981; margin-top: 0;">🔨 Auctioneer Controls</h3>
  
  <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
    <button onclick="handlePauseTimer()" style="background: #f59e0b; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
      ⏸️ Pause Timer
    </button>
    <button onclick="handleResumeTimer()" style="background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
      ▶️ Resume Timer
    </button>
    <button onclick="handleHammerSale()" style="background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
      🔨 Declare Sold (Hammer Sale)
    </button>
    <button onclick="handleNextLot()" style="background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold;">
      ➡️ Next Lot (Lot #105)
    </button>
  </div>
</div>

<script>
  function handlePauseTimer() {
    clearInterval(timerInterval);
    alert('Auction timer paused by Auctioneer.');
  }

  function handleResumeTimer() {
    startTimer();
    alert('Auction timer resumed.');
  }

  function handleHammerSale() {
    clearInterval(timerInterval);
    alert(`HAMMER SALE! Lot #${currentLot} SOLD to ${currentHighestBidder} at ₹${currentBid}/kg!`);
  }

  function handleNextLot() {
    currentLot += 1;
    document.getElementById('lot-number').innerText = `LOT #${currentLot}`;
    currentBid = 2100; // Reset to base price
    document.getElementById('highest-bid-display').innerText = `₹ ${currentBid} / kg`;
    resetTimer();
    alert(`Advanced to LOT #${currentLot}`);
  }
</script>
